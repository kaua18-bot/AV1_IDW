<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Lista de Tarefas</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Fontes -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
    <div class="badge">⚽ Avanti Palestra</div>

    <div class="card">
        <h1>Minha Lista de <span>Tarefas</span></h1>

        <form id="form-tarefas">
            <div class="form-group">
                <label>Nova tarefa</label>
                <div class="input-row">
                    <input type="text" id="input-tarefa" placeholder="Digite sua tarefa..." />
                    <button type="submit" class="btn-add">Adicionar</button>
                </div>
            </div>
            <p id="mensagem-erro"></p>
        </form>

        <hr class="divider">

        <ul id="lista-tarefas"></ul>

        <p class="contador" id="contador">
            <span id="num-tarefas">0</span> tarefa(s)
        </p>
    </div>
</div>

<!-- JS -->
<script src="script.js"></script>

</body>
</html>
