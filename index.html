<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Lista de Tarefas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>Minha Lista de Tarefas</h1>

            <form id="form-tarefas" novalidate>
                <div class="form-group">
                    <label for="input-tarefa">Tarefa</label>
                    <input type="text" id="input-tarefa" placeholder="Digite sua tarefa" aria-describedby="mensagem-erro" />
                </div>

                <div class="actions">
                    <button type="submit" class="btn">Adicionar</button>
                </div>
            </form>

            <p id="mensagem-erro" class="mensagem mensagem-erro" role="alert" aria-live="polite"></p>

            <ul id="lista-tarefas" class="tarefas-lista"></ul>
        </div>
    </div>

    <script src="js/script.js"></script>

</body>
</html>
